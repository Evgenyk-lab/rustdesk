name: iDiags Sciter (legacy) Build

env:
  SCITER_RUST_VERSION: "1.75" # https://github.com/rustdesk/rustdesk/discussions/7503, also 1.78 has ABI change which causes our sciter version not working, https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  RUST_VERSION: "1.75" # sciter failed on m1 with 1.78 because of https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  MAC_RUST_VERSION: "1.81" # 1.81 is requred for macos, because of https://github.com/yury/cidre requires 1.81
  CARGO_NDK_VERSION: "3.1.2"
  SCITER_ARMV7_CMAKE_VERSION: "3.29.7"
  SCITER_NASM_DEBVERSION: "2.15.05-1"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  # Windows arm64 only: the first stable Flutter to ship a native arm64 Windows Dart SDK +
  # engine is 3.44. Every other platform stays on FLUTTER_VERSION (3.24.5) until Windows 7
  # support is restored after the upstream-wide Flutter bump. The arm64 job patches the few
  # 3.44-only source/pubspec changes on the fly (see "Patch RustDesk sources for Flutter 3.44").
  FLUTTER_WINDOWS_ARM_VERSION: "3.44.8"
  # for arm64 linux because official Dart SDK does not work
  FLUTTER_ELINUX_VERSION: "3.16.9"
  TAG_NAME: "idiags"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  # vcpkg version: 2025.08.27
  # If we change the `VCPKG COMMIT_ID`, please remember:
  # 1. Call `$VCPKG_ROOT/vcpkg x-update-baseline` to update the baseline in `vcpkg.json`.
  #  Or we may face build issue like 
  #  https://github.com/rustdesk/rustdesk/actions/runs/14414119794/job/40427970174
  # 2. Update the `VCPKG_COMMIT_ID` in `ci.yml` and `playground.yml`.
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  ARMV7_VCPKG_COMMIT_ID: "6f29f12e82a8293156836ad81cc9bf5af41fe836" # 2025.01.13, got "/opt/artifacts/vcpkg/vcpkg: No such file or directory" with latest version
  VERSION: ${{ inputs.version || '1.4.11' }}
  NDK_VERSION: "r28c"
  #signing keys env variable checks
  ANDROID_SIGNING_KEY: "${{ secrets.ANDROID_SIGNING_KEY }}"
  MACOS_P12_BASE64: "${{ secrets.MACOS_P12_BASE64 }}"
  UPLOAD_ARTIFACT: "true"
  SIGN_BASE_URL: "${{ secrets.SIGN_BASE_URL }}-2"


on:
  workflow_dispatch:
    inputs:
      version:
        description: "iDiags release version (Cargo/UI/artifacts)"
        required: false
        default: "1.4.11"

permissions:
  contents: write

jobs:

  build-for-windows-sciter:
    name: ${{ matrix.job.target }} (${{ matrix.job.os }})
    runs-on: ${{ matrix.job.os }}
    # Temporarily disable this action due to additional test is needed.
    # if: false
    strategy:
      fail-fast: false
      matrix:
        job:
          # - { target: i686-pc-windows-msvc        , os: windows-2022                  }
          # - { target: x86_64-pc-windows-gnu       , os: windows-2022                  }
          - {
              target: i686-pc-windows-msvc,
              os: windows-2022,
              arch: x86,
              vcpkg-triplet: x86-windows-static,
            }
          # - { target: aarch64-pc-windows-msvc, os: windows-2022 }
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: iDiags branding
        shell: bash
        run: |
          sed -i 's/RwLock::new("RustDesk".to_owned())/RwLock::new("iDiags".to_owned())/' libs/hbb_common/src/config.rs
          sed -i 's#"rs-ny.rustdesk.com"#"rv.idiags.xyz", "rv2.idiags.xyz"#' libs/hbb_common/src/config.rs
          sed -i 's#OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw=#rWcO6oXUda0KMQnPuuzD1uULO6iEUA4bVrUB+9voLLA=#' libs/hbb_common/src/config.rs
          cp branding/idiags/icon.ico res/icon.ico || true
          cp branding/idiags/icon.ico res/tray-icon.ico || true
          (grep -rl "rustdesk.com" src libs --include=*.rs || true) | xargs -r sed -i "s#rustdesk.com#idiags.xyz#g" || true
          (grep -rl "rustdesk.com" src/ui || true) | xargs -r sed -i "s#rustdesk.com#idiags.xyz#g" || true
          (grep -rl "Purslane Tech Pte. Ltd." src/ui || true) | xargs -r sed -i "s/Purslane Tech Pte. Ltd./STAR/g" || true
          python3 -c "import re; b=open('branding/idiags/logo128.b64').read().strip(); s=open('src/ui.rs').read(); s=re.sub(r'data:image/png;base64,[A-Za-z0-9+/=]+','data:image/png;base64,'+b,s); open('src/ui.rs','w').write(s)"
          (grep -rl "powered_by_me" src/lang || true) | xargs -r sed -i "s/Powered by RustDesk/iDiags Assist/g; s/Основано на RustDesk/iDiags Assist/g" || true
          sed -i "s/height:1.6em; line-height:1.6em/min-height:1.6em; line-height:1.6em/g" src/ui/index.tis || true
          # версия 1.4.11 (Cargo.toml + Cargo.lock, иначе cargo build --locked падает)
          sed -i "s#^version = \"1.4.9\"#version = \"${VERSION}\"#" Cargo.toml || true
          sed -i "/^name = \"rustdesk\"\$/{n;s/^version = \"1.4.9\"\$/version = \"${VERSION}\"/}" Cargo.lock || true
          sed -i 's#https://api.rustdesk.com/version/latest#https://api.idiags.xyz/version/latest#' libs/hbb_common/src/lib.rs || true
          # B: одноразовый пароль ПЕРСИСТЕНТНЫЙ (переживает перезапуск); регенерация кнопкой сохраняется
          # B v2: НИКАКОГО I/O в инициализаторе lazy_static (v1 роняла старт). Загрузка/первичное сохранение -
          # один раз при первом вызове temporary_password() через std::sync::Once, уже после загрузки Config.
          OTP='    static __IDIAGS_OTP_LOAD: std::sync::Once = std::sync::Once::new(); __IDIAGS_OTP_LOAD.call_once(|| { let saved = Config::get_option("idiags-otp"); if !saved.is_empty() { *TEMPORARY_PASSWORD.write().unwrap() = saved; } else { let cur = TEMPORARY_PASSWORD.read().unwrap().clone(); Config::set_option("idiags-otp".to_owned(), cur); } });'
          export OTP
          python3 -c "import os; p='libs/hbb_common/src/password_security.rs'; s=open(p,encoding='utf-8').read(); a='pub fn temporary_password() -> String {'; s=(s.replace(a, a+chr(10)+os.environ['OTP'],1) if a in s else s); open(p,'w',encoding='utf-8').write(s)"
          sed -i 's#\*TEMPORARY_PASSWORD.write().unwrap() = get_auto_password();#{ let __np = get_auto_password(); Config::set_option("idiags-otp".to_owned(), __np.clone()); *TEMPORARY_PASSWORD.write().unwrap() = __np; }#' libs/hbb_common/src/password_security.rs || true
          grep -n "idiags-otp" libs/hbb_common/src/password_security.rs | head -2 || true
          # обновления: включить проверку для кастомного клиента (снять ранний return) -> кнопка обновления
          sed -i '/pub fn check_software_update() {/{N;N;N;s/\n    if is_custom_client() {\n        return;\n    }//}' src/common.rs || true
          grep -A2 "pub fn check_software_update" src/common.rs | head -3 || true
          # версия в заголовке окна (Sciter): iDiags 1.4.11
          sed -i 's/frame.set_title(&crate::get_app_name());/frame.set_title(\&format!("{} {}", crate::get_app_name(), crate::VERSION));/' src/ui.rs || true
          grep -n 'crate::VERSION' src/ui.rs | head -1 || true
          # legacy: уведомление об обновлении сделать КЛИКАБЕЛЬНЫМ (у кастом-клиента RustDesk показывает только текст) и вести на лендинг
          sed -i 's#? <div style="font-size: 1em; font-weight: normal; text-align: left; padding-top: 1em;">{translate(.Enable .*administrator for the latest version\..)}</div>#? <div \#install-me.link>{translate("Click to " + update_or_download)}</div>#' src/ui/index.tis || true
          sed -i 's#https://idiags.xyz/download#https://idiags.xyz/#g' src/ui/index.tis || true
          grep -c 'install-me.link' src/ui/index.tis || true
          # legacy: при наличии обновления прятать InstallMe, иначе UpdateMe рисуется ниже и уходит за нижний край панели
          sed -i 's#{(!is_win || handler.is_installed() || disable_installation) ? "" : <InstallMe />}#{(!is_win || handler.is_installed() || disable_installation || software_update_url) ? "" : <InstallMe />}#' src/ui/index.tis || true
          grep -c 'disable_installation || software_update_url' src/ui/index.tis || true
          # ЛОГ КАК АДМИН-ОПЦИЯ: по умолчанию info; файл-флаг <log_path>/debug.on включает debug (RUST_LOG по-прежнему приоритетнее)
          sed -i 's#if let Ok(x) = Logger::try_with_env_or_str("debug,reqwest=warn,rustls=warn,webrtc-sctp=warn,webrtc=warn") {#let __lvl = if config::Config::log_path().join("debug.on").exists() { "debug,reqwest=warn,rustls=warn,webrtc-sctp=warn,webrtc=warn" } else { "info,reqwest=warn,rustls=warn,webrtc-sctp=warn,webrtc=warn" }; if let Ok(x) = Logger::try_with_env_or_str(__lvl) {#' libs/hbb_common/src/lib.rs || true
          grep -c 'debug.on' libs/hbb_common/src/lib.rs || true
          # IN-APP «ОБНОВИТЬ» (Sciter/legacy): клик качает <software_update_url>/rustdesk-<ver>-x86-sciter.exe в %TEMP% через штатный download() (view.request toFile) и запускает через open_url (explorer <файл>). При ошибке - лендинг.
          TIS_A='        handler.open_url("https://idiags.xyz/");'
          TIS_B='        var __v = software_update_url.split("/").pop(); var __url = software_update_url + "/rustdesk-" + __v + "-x86-sciter.exe"; var __path = handler.get_software_store_path() + "-x86-sciter.exe"; $(#download-percent).style.set{display: "block"}; $(#download-percent).content("Downloading..."); download(__url, self.url(__path), function(md5) { $(#download-percent).content(translate("Installing ...")); handler.open_url(__path); }, function(err) { $(#download-percent).content(""); handler.open_url("https://idiags.xyz/"); }, function(loaded, total) { $(#download-percent).content("Downloading " + (total ? Math.floor(loaded * 100 / total) : 0) + "%"); });'
          export TIS_A TIS_B
          python3 -c "import os; p='src/ui/index.tis'; s=open(p,encoding='utf-8').read(); a=os.environ['TIS_A']+chr(10)+'        return;'+chr(10); b=os.environ['TIS_B']+chr(10)+'        return;'+chr(10); n=s.count(a); s=s.replace(a,b,1); open(p,'w',encoding='utf-8').write(s); print('tis in-app update anchors found:', n)"
          grep -c 'x86-sciter.exe' src/ui/index.tis || true
          # legacy: подпись кнопки «Обновить» (translate Update) вместо захардкоженного «Click to download»; фраза карточки локализована через ключ new-version-of-{}-tip
          sed -i 's#{translate("Click to " + update_or_download)}#{translate("Update")}#' src/ui/index.tis || true
          sed -i 's#<div>There is a newer version of {handler.get_app_name()} ({handler.get_new_version()}) available.</div>#<div>{translate("new-version-of-{" + handler.get_app_name() + "}-tip")} ({handler.get_new_version()}).</div>#' src/ui/index.tis || true
          grep -c 'translate("Update")' src/ui/index.tis || true; grep -c 'new-version-of-{' src/ui/index.tis || true
          # iDiags: fully hide "powered by" in sciter UI (was only renamed above)
          sed -i 's/handler.get_builtin_option("hide-powered-by-me") != "Y"/false/' src/ui/index.tis || true
          echo "== iDiags sciter branding =="

      - name: Install LLVM and Clang
        uses: rustdesk-org/install-llvm-action-32bit@6aa7d9ad3df84dff01cd4596dd0fc880a7f47fce # no release tag; commit 2026-05-26
        with:
          version: ${{ env.LLVM_VERSION }}

      # iDiags: install the 32-bit (i686) HOST nightly manually. rustup on current runner images
      # refuses a non-host (32-bit) toolchain on a 64-bit machine without --force-non-host, which the
      # dtolnay action cannot pass. The sciter build is a host build (no --target), so we keep i686 host.
      - name: Install Rust toolchain
        shell: bash
        run: |
          TC=nightly-2023-10-13-${{ matrix.job.target }} # nightly required for abi_thiscall feature
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused -sSfL https://win.rustup.rs/x86_64 -o rustup-init.exe
            ./rustup-init.exe --default-toolchain none --no-modify-path -y
            echo "$USERPROFILE\\.cargo\\bin" >> "$GITHUB_PATH"
            export PATH="$USERPROFILE/.cargo/bin:$PATH"
          fi
          rustup toolchain install "$TC" --force-non-host --profile minimal --component rustfmt --no-self-update
          # 'rustup default' re-runs the host check (no --force-non-host); select the toolchain for all
          # later steps via RUSTUP_TOOLCHAIN instead, which the proxies honor without the host guard.
          echo "RUSTUP_TOOLCHAIN=$TC" >> "$GITHUB_ENV"
          export RUSTUP_TOOLCHAIN="$TC"
          rustc --version

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: ${{ matrix.job.os }}-sciter

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.job.vcpkg-triplet }}
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet ${{ matrix.job.vcpkg-triplet }} \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log" || true
        shell: bash

      - name: Build rustdesk
        id: build
        shell: bash
        run: |
          python3 res/inline-sciter.py
          # Patch sciter x86
          sed -i 's/branch = "dyn"/branch = "dyn_x86"/g' ./Cargo.toml
          cargo update -p sciter-rs --precise 674e07d3066ca9a92ced3816203ab6b652629d1e
          cargo build --locked --features inline,vram,hwcodec --release --bins
          mkdir -p ./Release
          mv ./target/release/rustdesk.exe ./Release/rustdesk.exe
          curl -LJ -o ./Release/sciter.dll https://github.com/c-smile/sciter-sdk/raw/master/bin.win/x32/sciter.dll
          echo "output_folder=./Release" >> $GITHUB_OUTPUT
          curl -LJ -o ./usbmmidd_v2.zip https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip
          unzip usbmmidd_v2.zip
          # Do not remove x64 files, because the user may run the 32bit version on a 64bit system.
          # Do not remove ./usbmmidd_v2/deviceinstaller64.exe, as x86 exe cannot install and uninstall drivers when running on x64,
          # we need the x64 exe to install and uninstall the driver.
          rm -rf ./usbmmidd_v2/deviceinstaller.exe ./usbmmidd_v2/usbmmidd.bat
          mv ./usbmmidd_v2 ./Release || true

      - name: find Runner.res
        # Windows: find Runner.res (compiled from ./flutter/windows/runner/Runner.rc), copy to ./Runner.res
        # Runner.rc does not contain actual version, but Runner.res does
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ "$runner_res" == "" ]; then
            echo "Runner.res: not found";
          else
            echo "Runner.res: $runner_res";
            cp $runner_res ./libs/portable/Runner.res;
            echo "list ./libs/portable/Runner.res";
            ls -l ./libs/portable/Runner.res;
          fi

      - name: Upload unsigned
        if: env.UPLOAD_ARTIFACT == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdesk-unsigned-windows-${{ matrix.job.arch }}
          path: Release

      - name: Sign rustdesk files
        if: env.UPLOAD_ARTIFACT == 'true' && env.SIGN_BASE_URL != '-2'
        shell: bash
        run: |
          pip3 install requests argparse
          BASE_URL=${{ env.SIGN_BASE_URL }} SECRET_KEY=${{ secrets.SIGN_SECRET_KEY }} python3 res/job.py sign_files ./Release/

      - name: Build self-extracted executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../Release/ -o . -e ../../Release/rustdesk.exe
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe ./SignOutput/rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}-sciter.exe

      - name: Sign rustdesk self-extracted file
        if: env.UPLOAD_ARTIFACT == 'true' && env.SIGN_BASE_URL != '-2'
        shell: bash
        run: |
          BASE_URL=${{ env.SIGN_BASE_URL }} SECRET_KEY=${{ secrets.SIGN_SECRET_KEY }} python3 res/job.py sign_files ./SignOutput/

      - name: Publish Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        if: env.UPLOAD_ARTIFACT == 'true'
        with:
          prerelease: true
          tag_name: ${{ env.TAG_NAME }}
          files: |
            ./SignOutput/rustdesk-*.exe

